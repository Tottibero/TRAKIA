<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HC-08-01 · Propuesta Mover entrenamiento</title>
    <style>
      :root { color-scheme: dark; --bg:#0b0c0c; --surface:#141616; --raised:#1c1f1f; --text:#f4f1eb; --muted:#b2b3ae; --quiet:#898c89; --border:#303434; --red:#c81f19; --focus:#fe514a; --amber:#f3d28a; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
      * { box-sizing:border-box; }
      body { margin:0; padding:40px 24px 64px; background:#090a0a; color:var(--text); }
      h1 { max-width:780px; margin:0 auto 8px; font-size:22px; letter-spacing:-.025em; }
      .intro { max-width:780px; margin:0 auto 32px; color:var(--muted); font-size:14px; line-height:1.55; }
      .boards { display:flex; justify-content:center; align-items:flex-start; gap:28px; flex-wrap:wrap; }
      figure { width:min(100%,390px); margin:0; }
      figcaption { margin:0 0 10px; color:var(--muted); font-size:13px; }
      .phone { position:relative; width:100%; height:690px; overflow:hidden; border:1px solid #3c4140; border-radius:24px; background:var(--bg); box-shadow:0 18px 48px #0008; }
      .top { display:flex; justify-content:space-between; align-items:center; height:56px; padding:8px 18px 12px; border-bottom:1px solid var(--border); color:var(--muted); font-size:13px; }
      .brand { color:var(--text); font-weight:700; letter-spacing:-.04em; }
      main { padding:24px 20px 168px; }
      .back { color:var(--muted); font-size:13px; text-decoration:underline; text-underline-offset:4px; }
      h2 { margin:26px 0 4px; font-size:18px; font-weight:600; }
      time { color:var(--muted); font-size:14px; }
      .session { margin-top:26px; padding:16px; border:1px solid var(--border); border-radius:12px; background:var(--surface); }
      .session strong { font-size:15px; }
      .session p { margin:7px 0 0; color:var(--muted); font-size:13px; line-height:1.5; }
      .footer { position:absolute; inset:auto 0 62px; padding:12px 16px; border-top:1px solid var(--border); background:var(--bg); }
      .primary,.secondary,.confirm,.cancel { display:flex; min-height:48px; width:100%; align-items:center; justify-content:center; border-radius:8px; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; }
      .primary { border:0; background:var(--red); color:white; }
      .secondary { margin-top:8px; border:1px solid #555b59; background:transparent; color:var(--text); }
      button:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
      .nav { position:absolute; inset:auto 0 0; display:flex; height:62px; align-items:center; justify-content:center; border-top:1px solid var(--border); background:var(--surface); color:var(--muted); font-size:12px; }
      .scrim { position:absolute; inset:0; display:flex; align-items:flex-end; background:#000a; }
      .sheet { width:100%; max-height:84%; overflow:auto; padding:12px 18px calc(18px + env(safe-area-inset-bottom)); border:1px solid var(--border); border-bottom:0; border-radius:16px 16px 0 0; background:var(--surface); }
      .handle { width:38px; height:4px; margin:0 auto 16px; border-radius:4px; background:#606563; }
      .sheet h3 { margin:0; font-size:18px; line-height:1.3; }
      .sheet .hint { margin:5px 0 14px; color:var(--muted); font-size:13px; line-height:1.45; }
      .day-list { display:grid; gap:8px; }
      .day { display:flex; min-height:54px; align-items:center; justify-content:space-between; gap:12px; padding:8px 12px; border:1px solid var(--border); border-radius:8px; background:#111313; color:var(--text); text-align:left; }
      .day.selected { border-color:var(--focus); background:#251615; }
      .day .date { font-size:14px; font-weight:600; }
      .kind { flex:none; color:var(--muted); font-size:12px; }
      .kind.rest { padding:4px 8px; border-radius:8px; background:var(--raised); color:var(--muted); }
      .notice { margin:10px 0 0; padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:var(--raised); color:var(--muted); font-size:12px; line-height:1.45; }
      .actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; }
      .cancel,.confirm { min-height:48px; }
      .cancel { border:1px solid var(--border); background:transparent; color:var(--text); }
      .confirm { border:0; background:var(--red); color:white; }
      .confirm:disabled { opacity:.48; cursor:not-allowed; }
      .state-label { position:absolute; z-index:1; top:64px; right:14px; padding:8px 12px; border:1px solid var(--border); border-radius:999px; background:#101212; color:var(--muted); font-size:10px; }
      @media (max-width:420px) { body { padding:24px 12px 40px; } .boards { gap:20px; } .phone { height:690px; } }
      @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; } }
    </style>
  </head>
  <body>
    <h1>Mover entrenamiento</h1>
    <p class="intro">Propuesta aislada para el detalle de una sesión pendiente. La acción secundaria queda justo debajo del inicio. El selector muestra solo destinos elegibles de esa misma semana y sustituye únicamente el descanso del propio plan.</p>
    <div class="boards">
      <figure>
        <figcaption>375 px · acción cerrada</figcaption>
        <div class="phone">
          <div class="top"><span class="brand">TRAKIA</span><span>Plan semanal</span></div>
          <main>
            <span class="back">‹ Volver al calendario</span>
            <h2>Plan de fuerza</h2><time>Martes 24-11</time>
            <div class="session"><strong>Fuerza · tren superior</strong><p>3 bloques · ejercicios y objetivos se mantienen al cambiar de día.</p></div>
          </main>
          <div class="footer"><button class="primary">Iniciar sesión</button><button class="secondary">Mover entrenamiento</button></div>
          <div class="nav">Inicio　 ·　 Progreso　 ·　 Perfil</div>
        </div>
      </figure>
      <figure>
        <figcaption>390 px · selector abierto, descanso seleccionado</figcaption>
        <div class="phone">
          <div class="top"><span class="brand">TRAKIA</span><span>Plan semanal</span></div>
          <main>
            <span class="back">‹ Volver al calendario</span>
            <h2>Plan de fuerza</h2><time>Martes 24-11</time>
            <div class="session"><strong>Fuerza · tren superior</strong><p>3 bloques · ejercicios y objetivos se mantienen al cambiar de día.</p></div>
          </main>
          <div class="footer"><button class="primary">Iniciar sesión</button><button class="secondary">Mover entrenamiento</button></div>
          <div class="nav">Inicio　 ·　 Progreso　 ·　 Perfil</div>
          <div class="scrim">
            <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="title">
              <div class="handle" aria-hidden="true"></div>
              <h3 id="title">Mover entrenamiento</h3>
              <p class="hint">Elige otro día de esta semana</p>
              <div class="day-list">
                <button class="day"><span class="date">Miércoles · 25 nov</span><span class="kind">Día libre</span></button>
                <button class="day selected" aria-pressed="true"><span class="date">Jueves · 26 nov</span><span class="kind rest">Descanso</span></button>
                <button class="day"><span class="date">Viernes · 27 nov</span><span class="kind">Día libre</span></button>
                <button class="day"><span class="date">Sábado · 28 nov</span><span class="kind rest">Descanso</span></button>
                <button class="day"><span class="date">Domingo · 29 nov</span><span class="kind">Día libre</span></button>
              </div>
              <p class="notice">Este día tiene un descanso del plan. Al confirmar, se sustituirá por el entrenamiento.</p>
              <div class="actions"><button class="cancel">Cancelar</button><button class="confirm">Confirmar cambio</button></div>
            </section>
          </div>
        </div>
      </figure>
    </div>
  </body>
</html>
