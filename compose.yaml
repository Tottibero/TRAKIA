name: trakia

# Keep generated artifacts in Docker volumes so container UID mapping cannot
# change ownership of the host's dist directories.
services:
  contracts:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    command: >-
      sh -c "pnpm --filter @trakia/contracts build && touch /tmp/contracts-ready &&
      pnpm --filter @trakia/contracts exec tsc -p tsconfig.json --watch --preserveWatchOutput"
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - api_node_modules:/workspace/apps/api/node_modules
      - web_node_modules:/workspace/apps/web/node_modules
      - contracts_node_modules:/workspace/packages/contracts/node_modules
      - contracts_dist:/workspace/packages/contracts/dist
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:fs').accessSync('/tmp/contracts-ready')"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    command: pnpm --filter @trakia/web dev
    environment:
      VITE_API_PROXY_TARGET: http://api:3033
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - api_node_modules:/workspace/apps/api/node_modules
      - web_node_modules:/workspace/apps/web/node_modules
      - contracts_node_modules:/workspace/packages/contracts/node_modules
      - web_dist:/workspace/apps/web/dist
      - contracts_dist:/workspace/packages/contracts/dist
    depends_on:
      contracts:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    command: pnpm --filter @trakia/api dev:docker
    environment:
      PORT: 3033
    ports:
      - "127.0.0.1:3033:3033"
    volumes:
      - .:/workspace
      - root_node_modules:/workspace/node_modules
      - api_node_modules:/workspace/apps/api/node_modules
      - web_node_modules:/workspace/apps/web/node_modules
      - contracts_node_modules:/workspace/packages/contracts/node_modules
      - contracts_dist:/workspace/packages/contracts/dist
    depends_on:
      contracts:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3033/api/health').then(r => process.exit(r.status === 200 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  db:
    image: postgres:17.6-bookworm
    env_file:
      - .env.docker
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  root_node_modules:
  api_node_modules:
  web_node_modules:
  contracts_node_modules:
  web_dist:
  contracts_dist:
  postgres_data:

networks:
  default:
    name: trakia_default
    driver: bridge
